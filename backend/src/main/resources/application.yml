# 主配置文件 - 通用配置
spring:
  application:
    name: backend
  profiles:
    active: dev  # 默认激活开发环境
  main:
    allow-circular-references: false # 明确禁止循环引用

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# JWT配置 - 通用配置
jwt:
  header: Authorization
  prefix: Bearer 

# 应用配置 - 通用配置
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # 密码策略
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special-char: false
    # 登录策略
    login:
      max-attempts: 5
      lockout-duration: 300000  # 5分钟 (毫秒)
  # 默认角色和权限
  default:
    role: USER
    permissions:
      - USER_READ
      - USER_UPDATE_SELF

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  main:
    allow-circular-references: false  # 明确禁止循环引用
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 日志配置 - 开发环境
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security.web.access: DEBUG
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
    com.demo.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置 - 开发环境
jwt:
  secret: ${JWT_SECRET:ZGV2X3NlY3JldF9rZXlfbXVzdF9iZV9hdF9sZWFzdF8zMl9ieXRlc19sb25nX2Zvcl9oczI1Nl9hbGdvcml0aG0=}
  expiration: 86400000      # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)

# 应用配置 - 开发环境
app:
  security:
    concurrent:
      max-sessions: 3  # 开发环境允许更多并发会话
      prevent-login-if-maximum-exceeded: false

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test
  main:
    allow-circular-references: false  # 明确禁止循环引用
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.H2Dialect
  # Redis配置 - 测试环境
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 1  # 使用不同的数据库
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 4
          min-idle: 0
          max-wait: -1ms

# 日志配置 - 测试环境
logging:
  level:
    root: DEBUG
    org.springframework: DEBUG
    org.hibernate: DEBUG
    com.demo.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT配置 - 测试环境
jwt:
  secret: ${JWT_SECRET:dGVzdF9zZWNyZXRfa2V5X211c3RfYmVfYXRfbGVhc3RfMzJfYnl0ZXNfbG9uZ19mb3JfaHMyNTZfYWxnb3JpdGht}
  expiration: 3600000       # 1小时 (毫秒) - 测试环境较短过期时间
  refresh-expiration: 86400000  # 1天 (毫秒)

# 应用配置 - 测试环境
app:
  security:
    concurrent:
      max-sessions: 2
      prevent-login-if-maximum-exceeded: true

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/backend_prod?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境不自动修改表结构
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  # Redis配置 - 生产环境
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 100ms

# 服务器配置 - 生产环境
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# 日志配置 - 生产环境
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    com.demo.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 100MB
    max-history: 30

# JWT配置 - 生产环境
jwt:
  secret: ${JWT_SECRET:}  # 必须通过环境变量设置
  expiration: ${JWT_EXPIRATION:3600000}      # 1小时 (毫秒)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}  # 1天 (毫秒)

# 应用配置 - 生产环境
app:
  security:
    concurrent:
      max-sessions: ${MAX_SESSIONS:1}
      prevent-login-if-maximum-exceeded: ${PREVENT_LOGIN_IF_MAX_EXCEEDED:true}

# 监控配置 - 生产环境
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

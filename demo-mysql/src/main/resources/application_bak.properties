spring.application.name=demo-mysql
# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
spring.datasource.username=root
spring.datasource.password=5382
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update # 自动更新表结构（开发阶段用，生产环境建议用 validate 或 none）
spring.jpa.show-sql=true # 打印 SQL 日志（调试用）
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true # 格式化 SQL 语句